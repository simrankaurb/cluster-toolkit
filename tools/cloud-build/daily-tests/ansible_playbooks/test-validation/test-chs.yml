---

- name: CHS Test Standard Suite
  delegate_to: "{{ 'localhost' if scheduler == 'gke' else inventory_hostname }}"
  vars:
    ansible_async_dir: "/tmp/.ansible_async_user"
    ansible_async_dir_root: "/tmp/.ansible_async_root"
  block:
  - name: Ensure async directories exist
    block:
    - name: Ensure user async directory exists
      ansible.builtin.file:
        path: "{{ ansible_async_dir }}"
        state: directory
        mode: '0700'

    - name: Ensure root async directory exists
      ansible.builtin.file:
        path: "{{ ansible_async_dir_root }}"
        state: directory
        mode: '0700'
      become: true

  - name: Setup environment for CHS
    become: true
    vars:
      ansible_async_dir: "{{ ansible_async_dir_root }}"
    block:
    - name: Set variables for CHS setup
      ansible.builtin.set_fact:
        chs_venv_path: "/opt/chs_venv"

    - name: Create Python Virtual Environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ chs_venv_path }}"
        creates: "{{ chs_venv_path }}/bin/python"
      async: 120
      poll: 10

  - name: Install and Setup CHS
    block:
    - name: Create temporary directory for CHS clone
      ansible.builtin.tempfile:
        state: directory
        suffix: chs_clone
      register: chs_temp_dir

    - name: Clone CHS repository
      ansible.builtin.git:
        repo: "{{ chs_repo }}"
        dest: "{{ chs_temp_dir.path }}"
        version: release
        accept_hostkey: true
      async: 120
      poll: 10

    - name: Install CHS into venv
      ansible.builtin.pip:
        name: "{{ chs_temp_dir.path }}"
        virtualenv: "{{ chs_venv_path }}"
      async: 300
      poll: 10
      become: true
      vars:
        ansible_async_dir: "{{ ansible_async_dir_root }}"

  - name: Perform CHS Operations
    environment:
      PATH: "{{ chs_venv_path }}/bin:{{ lookup('env', 'PATH') }}"
    block:
    - name: Configure bucket for CHS
      ansible.builtin.shell: |
        set -e -u
        chs configure storage gcs chs-results
      async: 120
      poll: 10
      changed_when: false

    - name: "Run CHS suites"
      ansible.builtin.shell: |
        set -e -u
        chs run -y --suite {{ item }} {{ chs_target }}
      loop: "{{ chs_suites | default(['standard']) }}"
      register: chs_runs
      async: 3000
      poll: 10
      changed_when: false
      vars:
        target_flag: "{{ '--nodepools' if scheduler == 'gke' else ('--partitions' if scheduler == 'slurm' else '') }}"
        target_val: "{{ (chs_nodepools if scheduler == 'gke' else (chs_partitions if scheduler == 'slurm' else '')) | default('') }}"
        chs_target: "{{ target_flag + ' ' + target_val if (target_flag and target_val) else '' }}"

    - name: CHS run output
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ chs_runs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Validate CHS Bill of Health JSON report for non-success results
      ansible.builtin.shell: |
        python3 -c '
        import json, glob, sys, os, subprocess

        paths = set(
            glob.glob("./*.json") +
            glob.glob("./results/*.json") +
            glob.glob("{{ chs_temp_dir.path }}/**/*.json", recursive=True) +
            glob.glob(os.path.expanduser("~/.chs/**/*.json"), recursive=True) +
            glob.glob("/tmp/**/*.json", recursive=True)
        )

        failures = []
        found_reports = 0

        def check_data(data):
            nonlocal found_reports
            if isinstance(data, dict) and "test_results" in data:
                found_reports += 1
                for tr in data.get("test_results", []):
                    name = tr.get("test_name", "unknown")
                    level = tr.get("test_level", "")
                    status = tr.get("result_status")
                    if status and status != "RESULT_STATUS_SUCCESS":
                        failures.append(f"{name} ({level}): {status}")
                    for m in tr.get("metrics", []):
                        vc = m.get("validation_criteria", {})
                        vc_status = vc.get("result_status")
                        if vc_status and vc_status != "RESULT_STATUS_SUCCESS":
                            k = m.get("key")
                            failures.append(f"{name} ({level}) metric '\''{k}'\'': {vc_status}")

        for p in paths:
            try:
                with open(p) as f:
                    data = json.load(f)
                check_data(data)
            except Exception:
                pass

        if found_reports == 0:
            try:
                latest_obj = subprocess.check_output(
                    ["gcloud", "storage", "ls", "gs://chs-results/bills_of_health/*.json"],
                    stderr=subprocess.DEVNULL
                ).decode().strip().splitlines()[-1]
                raw = subprocess.check_output(["gcloud", "storage", "cat", latest_obj], stderr=subprocess.DEVNULL)
                check_data(json.loads(raw))
            except Exception:
                pass

        if failures:
            print("ERROR: CHS Bill of Health contains non-success test result(s):")
            for f in sorted(set(failures)):
                print(f"  - {f}")
            sys.exit(1)

        print(f"CHS Bill of Health validation passed ({found_reports} report(s) checked, 0 failures).")
        '
      changed_when: false

  rescue:
  - name: CHS Test Failure
    ansible.builtin.debug:
      msg: "CHS tests failed or timed out. Continuing playbook execution."
    ignore_errors: true

  always:
  - name: Cleanup Kubernetes resources
    delegate_to: localhost
    ansible.builtin.shell: |
      kubectl delete jobset --all --ignore-not-found
      kubectl delete job --all --ignore-not-found
      kubectl delete pod --all --ignore-not-found
    async: 300
    poll: 10
    ignore_errors: true
    when: scheduler == 'gke'

  - name: Cleanup Slurm resources
    ansible.builtin.shell: |
      scancel -u $(whoami)
    async: 300
    poll: 10
    when: scheduler == 'slurm'
    ignore_errors: true

  - name: Cleanup temporary directory
    ansible.builtin.file:
      path: "{{ chs_temp_dir.path }}"
      state: absent
    become: true
    ignore_errors: true
    when: chs_temp_dir.path is defined
